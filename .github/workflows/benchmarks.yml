name: Benchmarks (manual)

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Space-separated firm counts"
        required: false
        default: "10000 50000 100000"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Run ESRIcascade vs Diem fastcascade comparison
        env:
          JULIA_NUM_THREADS: 1
        run: |
          julia --project=. benchmark/compare_fastcascade.jl ${{ inputs.sizes }}
